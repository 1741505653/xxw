<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学信档案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 30px;
            min-height: 100vh;
            background: #ffffff;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .logo-img {
            width: 120px;
            height: 60px;
            margin-right: 12px;
        }
        .logo-text {
            font-size: 36px;
            color: #403737;
            font-weight: bold;
            font-family: 楷体;
        }

        .login-desc {
            text-align: center;
            color: #999;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 18px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            color: #333;
            background: #fff;
        }
        .input-group input::placeholder {
            color: #999;
        }
        .input-group input:focus {
            outline: none;
            border-color: #21b573;
        }

        .login-btn {
            width: 100%;
            max-width: 500px;
            padding: 18px;
            background-color: #21b573;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-links {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .login-links a {
            color: #666;
            font-size: 16px;
            text-decoration: none;
        }

        .bottom-nav {
            display: flex;
            justify-content: center;
            margin-top: 80px;
            gap: 40px;
        }
        .nav-item {
            color: #666;
            font-size: 18px;
            text-decoration: none;
        }

        .main-container {
            display: none;
            min-height: 100vh;
            background: #f8f9fa;
            padding-bottom: 70px;
        }

        .main-header {
            background: #ffffff;
            padding: 15px 20px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid #f0f0f0;
        }
        .main-header h1 {
            font-size: 22px;
            color: #666;
            font-weight: 500;
        }
        .qr-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            opacity: 0.7;
        }

        .section {
            background: #ffffff;
            padding: 20px 15px;
            margin-bottom: 10px;
        }
        .section-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .icons-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .icons-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .icons-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 10px 5px;
        }
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            position: relative;
        }
        .icon-text {
            font-size: 14px;
            color: #333;
            text-align: center;
        }

        .icon-query { background: #e6f7f2; }
        .icon-query .icon-inner {
            width: 40px;
            height: 40px;
            background: #21b573;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .icon-verify { background: #e6f7f2; }

            width: 40px;
            height: 40px;

        .service-item {

        .service-item.bg-lightgreen { background: #e6f7f2; }
        .service-item.bg-lightorange { background: #fef6e9; }
        .service-icon {

            border-radius: 20%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .service-icon .inner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .service-icon.blue .inner { background: #409eff; }
        .service-icon.green .inner { background: #21b573; }
        .service-icon.orange .inner { background: #ff9f43; }
        .service-text {
            font-size: 14px;

        }

        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;

        .footer-nav-item {

        }
        .footer-nav-item.active {

        }
        .footer-nav-item i {

        @media (max-width: 375px) {
            .logo-text {
                font-size: 30px;
            }
            .icon-box {
                width: 50px;
                height: 50px;
            }
            .icon-inner {
                width: 35px;
                height: 35px;
            }
        }
    </style>

<!-- 引入 Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====================== 在这里填写你的 Supabase 信息 ======================
const SUPABASE_URL = "https://omslqgsetgidybyfoezk.supabase.co"; // 替换成你的 Project URL
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tc2xxZ3NldGdpZHlieWZvZXprIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwMjY5MDAsImV4cCI6MjA5MDYwMjkwMH0.CKkvdhE5MX32_KJx3NoUx43q_OlunP8Tbd5yhMPO5cI";   // 替换成你的密钥
// ==========================================================================

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ADMIN_PASSWORD = "zjl"; // 后台密码，保持不变

// 三连击打开后台
let clickCount = 0;
document.addEventListener('DOMContentLoaded', function() {
    const adminBtn = document.getElementById('adminBtn');
    adminBtn.onclick = () => {
        clickCount++;
        if (clickCount === 3) {
            const pwd = prompt("请输入管理员密码：");
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPage').style.display = 'block';
                loadAdminUserList();
            } else {
                alert("密码错误！");
            }
            clickCount = 0;
        }
        setTimeout(() => clickCount = 0, 800);
    };
});

// 登录逻辑（从 Supabase 验证）
const loginBtn = document.getElementById('loginBtn');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const loginPage = document.getElementById('loginPage');
const mainPage = document.getElementById('mainPage');
const studentQuery = document.getElementById('studentQuery');

loginBtn.addEventListener('click', async () => {
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if (!username || !password) {
        alert('请输入账号密码');
        return;
    }

    const { data, error } = await supabase
        .from('users')
        .select('*')
        .eq('username', username)
        .eq('password', password)
        .single();

    if (error || !data) {
        alert('账号或密码错误');
        return;
    }

    sessionStorage.setItem('user', JSON.stringify(data));
    loginPage.style.display = 'none';
    mainPage.style.display = 'block';
});

// 学籍查询跳转
studentQuery.addEventListener('click', () => {
    const user = JSON.parse(sessionStorage.getItem('user'));
    if (user?.redirect_url) {
        window.open(user.redirect_url, '_blank');
    } else {
        alert('请先登录');
    }
});

// 自动登录
document.addEventListener('DOMContentLoaded', () => {
    const user = sessionStorage.getItem('user');
    if (user) {
        loginPage.style.display = 'none';
        mainPage.style.display = 'block';
    }

    // 底部导航
    document.querySelectorAll('.footer-nav-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.footer-nav-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
        });
    });

    // 其他按钮提示
    document.querySelectorAll('.icon-item:not(#studentQuery), .service-item').forEach(item => {
        item.addEventListener('click', () => {
            const name = item.querySelector('.icon-text,.service-text').textContent;
            alert(`您点击了：${name}\n功能开发中...`);
        });
    });
});

// ====================== 后台管理（云端） ======================
async function loadAdminUserList() {
    const { data } = await supabase.from('users').select('*');
    const list = document.getElementById('userList');
    list.innerHTML = '';

    data.forEach(user => {
        const div = document.createElement('div');
        div.style.margin = '15px 0';
        div.style.padding = '10px';
        div.style.border = '1px solid #eee';
        div.style.borderRadius = '8px';
        div.innerHTML = `
            <div style="margin:8px 0;">
                <label>账号：</label>
                <input type="text" value="${user.username}" id="u_${user.id}" style="padding:6px 8px; width:150px;">
            </div>
            <div style="margin:8px 0;">
                <label>密码：</label>
                <input type="text" value="${user.password}" id="p_${user.id}" style="padding:6px 8px; width:150px;">
            </div>
            <div style="margin:8px 0;">
                <label>跳转URL：</label>
                <input type="text" value="${user.redirect_url || ''}" id="r_${user.id}" style="padding:6px 8px; width:350px;">
            </div>
            <button onclick="saveUser(${user.id})" style="padding:6px 12px;background:#21b573;color:#fff;border:none;border-radius:4px;margin-right:10px;">保存</button>
            <button onclick="delUser(${user.id})" style="padding:6px 12px;background:red;color:#fff;border:none;border-radius:4px;">删除</button>
        `;
        list.appendChild(div);
    });

    const addBtn = document.createElement('div');
    addBtn.style.marginTop = '20px';
    addBtn.innerHTML = `<button onclick="addUser()" style="padding:8px 16px;background:#000;color:#fff;border:none;border-radius:4px;cursor:pointer;">添加新用户</button>`;
    list.appendChild(addBtn);
}

async function saveUser(id) {
    const u = document.getElementById(`u_${id}`).value.trim();
    const p = document.getElementById(`p_${id}`).value.trim();
    const r = document.getElementById(`r_${id}`).value.trim();
    if (!u || !p) { alert('账号密码不能为空'); return; }

    await supabase.from('users').update({
        username: u,
        password: p,
        redirect_url: r
    }).eq('id', id);

    alert('保存成功！');
    loadAdminUserList();
}

async function delUser(id) {
    if (!confirm('确定删除？')) return;
    await supabase.from('users').delete().eq('id', id);
    alert('删除成功！');
    loadAdminUserList();
}

async function addUser() {
    const username = prompt('输入新账号：');
    if (!username) return;

    const { data } = await supabase.from('users').select('*').eq('username', username);
    if (data.length > 0) {
        alert('账号已存在');
        return;
    }

    await supabase.from('users').insert([{
        username,
        password: '123456',
        redirect_url: ''
    }]);

    alert('添加成功！默认密码：123456');
    loadAdminUserList();
}

function closeAdmin() {
    document.getElementById('adminPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
}
</script>
