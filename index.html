<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学信档案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: #fff;
        }
        .login {
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            max-width: 400px;
            width: 100%;
            padding: 14px;
            background: #2d8cf0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 10px;
        }
        .admin {
            display: none;
            padding: 20px;
        }
        .user-item {
            border: 1px solid #eee;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
        }
        .main {
            display: none;
            padding: 20px;
        }
        #adminBtn {
            position: fixed;
            right: 10px;
            bottom: 10px;
            width: 30px;
            height: 30px;
            opacity: 0;
        }
    </style>
</head>
<body>

<!-- 登录页 -->
<div class="login" id="loginPage">
    <h2>学信档案</h2>
    <input id="user" placeholder="账号">
    <input id="pwd" placeholder="密码" type="password">
    <button onclick="login()">登录</button>
    <div id="adminBtn"></div>
</div>

<!-- 主页 -->
<div class="main" id="mainPage">
    <h3>登录成功</h3>
    <button onclick="openImg()">查看学籍图片</button>
</div>

<!-- 后台管理 -->
<div class="admin" id="adminPage">
    <h3>云端用户管理（实时保存）</h3>
    <button onclick="addUser()">添加新用户</button>
    <div id="userList"></div>
    <button onclick="closeAdmin()">返回登录</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
<script>
// 🔥 已配置好免费云端数据库（所有人共用，实时同步）
AV.init({
  appId: "B8XtTDvNfGzvBd5U3F21OMyD-MdYXbMMI",
  appKey: "Xa3D8wZbARk98OvV2Kj1pLmXn",
  serverURL: "https://b8xttdvn.api.lncldglobal.com"
});
const UserDB = AV.Object.extend('UserDB');
let currentImg = '';

// ==================== 登录 ====================
async function login() {
    let u = document.getElementById('user').value.trim();
    let p = document.getElementById('pwd').value.trim();
    
    let query = new AV.Query('UserDB');
    query.equalTo('username', u);
    let res = await query.first();
    
    if (res && res.attributes.password === p) {
        currentImg = res.attributes.img;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainPage').style.display = 'block';
    } else {
        alert('账号或密码错误');
    }
}

function openImg() {
    if (currentImg) window.open(currentImg);
}

// ==================== 后台管理 ====================
let click = 0;
document.getElementById('adminBtn').onclick = () => {
    click++;
    if (click === 3) {
        let pw = prompt('管理员密码：');
        if (pw === 'admin123') {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            loadAdminList();
        }
        click = 0;
    }
};

async function loadAdminList() {
    let query = new AV.Query('UserDB');
    let list = await query.find();
    let dom = document.getElementById('userList');
    dom.innerHTML = '';
    
    list.forEach(item => {
        let id = item.id;
        let u = item.attributes.username;
        let p = item.attributes.password;
        let img = item.attributes.img;
        
        dom.innerHTML += `
        <div class="user-item">
            账号：<input id="u_${id}" value="${u}"><br>
            密码：<input id="p_${id}" value="${p}"><br>
            图片：<input id="i_${id}" value="${img}" style="width:90%"><br>
            <button onclick="saveUser('${id}')">保存</button>
            <button onclick="delUser('${id}')" style="background:red">删除</button>
        </div>`;
    });
}

async function addUser() {
    let u = prompt('输入账号：');
    if (!u) return;
    let p = prompt('输入密码：');
    let img = prompt('输入图片链接：');
    
    let data = new UserDB();
    data.set('username', u);
    data.set('password', p);
    data.set('img', img);
    await data.save();
    loadAdminList();
    alert('添加成功！云端已保存！');
}

async function saveUser(id) {
    let u = document.getElementById('u_'+id).value;
    let p = document.getElementById('p_'+id).value;
    let img = document.getElementById('i_'+id).value;
    
    let data = AV.Object.createWithoutData('UserDB', id);
    data.set('username', u);
    data.set('password', p);
    data.set('img', img);
    await data.save();
    alert('保存成功！实时同步！');
    loadAdminList();
}

async function delUser(id) {
    if (!confirm('确定删除？')) return;
    let data = AV.Object.createWithoutData('UserDB', id);
    await data.destroy();
    loadAdminList();
}

function closeAdmin() {
    document.getElementById('adminPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
}
</script>
</body>
</html>
