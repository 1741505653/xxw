<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学信档案</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 30px;
            min-height: 100vh;
            background: #ffffff;
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        .logo-img {
            width: 120px;
            height: 60px;
            margin-right: 12px;
        }
        .logo-text {
            font-size: 36px;
            color: #403737;
            font-weight: bold;
            font-family: 楷体;
        }

        .login-desc {
            text-align: center;
            color: #999;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .input-group {
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 18px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            color: #333;
            background: #fff;
        }
        .input-group input::placeholder {
            color: #999;
        }
        .input-group input:focus {
            outline: none;
            border-color: #21b573;
        }

        .login-btn {
            width: 100%;
            max-width: 500px;
            padding: 18px;
            background-color: #21b573;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-links {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }
        .login-links a {
            color: #666;
            font-size: 16px;
            text-decoration: none;
        }

        .bottom-nav {
            display: flex;
            justify-content: center;
            margin-top: 80px;
            gap: 40px;
        }
        .nav-item {
            color: #666;
            font-size: 18px;
            text-decoration: none;
        }

        .main-container {
            display: none;
            min-height: 100vh;
            background: #f8f9fa;
            padding-bottom: 70px;
        }

        .main-header {
            background: #ffffff;
            padding: 15px 20px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid #f0f0f0;
        }
        .main-header h1 {
            font-size: 22px;
            color: #666;
            font-weight: 500;
        }
        .qr-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            opacity: 0.7;
        }

        .section {
            background: #ffffff;
            padding: 20px 15px;
            margin-bottom: 10px;
        }
        .section-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .icons-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .icons-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .icons-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 10px 5px;
        }
        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            position: relative;
        }
        .icon-text {
            font-size: 14px;
            color: #333;
            text-align: center;
        }

        .icon-query { background: #e6f7f2; }
        .icon-query .icon-inner {
            width: 40px;
            height: 40px;
            background: #21b573;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .icon-verify { background: #e6f7f2; }
        .icon-verify .icon-inner {
            width: 40px;
            height: 40px;
            background: #21b573;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .icon-edu-query { background: #e6f4ff; }
        .icon-edu-query .icon-inner {
            width: 40px;
            height: 40px;
            background: #21b573;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .icon-edu-verify { background: #e6f4ff; }
        .icon-edu-verify .icon-inner {
           width: 40px;
            height: 40px;
            background: #eff2f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .icon-edu-cert { background: #e6f4ff; }
        .icon-edu-cert .icon-inner {
            width: 40px;
            height: 40px;
            background: #21b573;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .icon-degree-query { background: #e6f4ff; }
        .icon-degree-query .icon-inner {
            width: 40px;
            height: 40px;
            background: #f0f0f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .icon-degree-verify { background: #e6f4ff; }
        .icon-degree-verify .icon-inner {
            width: 40px;
            height: 40px;
            background: #eff1f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }

        .exam-banner {
            background: linear-gradient(to right, #f0f9ff, #e6f4ff);
            padding: 20px;
            margin: 0 15px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .exam-text {
            font-size: 20px;
            color: #333;
            font-weight: 500;
        }
        .exam-img {
            width: 120px;
            height: 80px;
            opacity: 0.9;
        }
        .check-badge {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: #21b573;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .service-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 15px 10px;
            border-radius: 12px;
        }
        .service-item.bg-lightblue { background: #e6f4ff; }
        .service-item.bg-lightgreen { background: #e6f7f2; }
        .service-item.bg-lightorange { background: #fef6e9; }
        .service-icon {
            width: 60px;
            height: 60px;
            border-radius: 20%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .service-icon .inner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .service-icon.blue .inner { background: #409eff; }
        .service-icon.green .inner { background: #21b573; }
        .service-icon.orange .inner { background: #ff9f43; }
        .service-text {
            font-size: 14px;
            color: #333;
            text-align: center;
        }

        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #f0f0f0;
        }
        .footer-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #999;
            font-size: 12px;
            cursor: pointer;
        }
        .footer-nav-item.active {
            color: #21b573;
        }
        .footer-nav-item i {
            font-size: 24px;
            margin-bottom: 5px;
        }

        @media (max-width: 375px) {
            .logo-text {
                font-size: 30px;
            }
            .icon-box {
                width: 50px;
                height: 50px;
            }
            .icon-inner {
                width: 35px;
                height: 35px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="login-container" id="loginPage">
    <div class="logo-wrap">
        <img src="https://s41.ax1x.com/2026/03/31/pe8RzUf.png" alt="学信网logo" class="logo-img">
        <span class="logo-text">学信档案</span>

    <p class="login-desc">请使用 学信网账号 进行登录</p>

</div>

<div class="main-container" id="mainPage">

    <div class="exam-banner" style="padding:0; background:none; display:block;">

<!-- 后台管理页面 -->
<div id="adminPage" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#fff; z-index:9999; padding:20px; box-sizing:border-box; overflow-y:auto;">
  <h2 style="text-align:center; margin-bottom:30px;">用户管理后台</h2>
  <div id="userList" style="max-width:800px; margin:0 auto;"></div>
  <button onclick="closeAdmin()" style="position:fixed; top:20px; right:20px; padding:8px 16px; background:#000; color:#fff; border:none; border-radius:4px; cursor:pointer;">关闭后台</button>
</div>
<!--用户信息登记处 重要重要重要++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++  -->
<script>
    const userDatabase = {
        "13603846915": { 
            password: "123456", 
            redirectUrl: "https://s41.ax1x.com/2026/03/31/pe82peP.jpg" 
        },
        "user2": { 
            password: "pass2", 
            redirectUrl: "https://s41.ax1x.com/2026/03/31/pe82ne0.jpg" 
        }
    };

    // 三连击后台入口 + 管理员密码验证
    let clickCount = 0;
    document.addEventListener('DOMContentLoaded', function() {
        const adminBtn = document.getElementById('adminBtn');
        adminBtn.onclick = function() {
            clickCount++;
            if (clickCount === 3) {
                // 验证管理员密码
                const adminPwd = prompt("请输入管理员密码：");
                if(adminPwd === "zjl"){
                    // 密码正确，进入后台
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('adminPage').style.display = 'block';
                    renderUserList();
                } else {
                    // 密码错误
                    alert("管理员密码错误！");
                }
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 800);
        };
    });

    const loginPage = document.getElementById('loginPage');
    const mainPage = document.getElementById('mainPage');
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const studentQueryBtn = document.getElementById('studentQuery');

    loginBtn.addEventListener('click', function() {
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
            alert('请输入手机号/邮箱和密码');
            return;
        }

        const user = userDatabase[username];
        if (user && user.password === password) {
            sessionStorage.setItem('currentUser', username);
            sessionStorage.setItem('redirectUrl', user.redirectUrl);
            loginPage.style.display = 'none';
            mainPage.style.display = 'block';
        } else {
            alert('账号或密码错误');
        }
    });

    studentQueryBtn.addEventListener('click', function() {
        const redirectUrl = sessionStorage.getItem('redirectUrl');
        if (redirectUrl) {
            window.open(redirectUrl, '_blank');
        } else {
            alert('请先登录');
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        const savedUser = sessionStorage.getItem('currentUser');
        if (savedUser) {
            loginPage.style.display = 'none';
            mainPage.style.display = 'block';
        }

        document.querySelectorAll('.footer-nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.footer-nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
            });
        });

        document.querySelectorAll('.icon-item:not(#studentQuery), .service-item').forEach(item => {
            item.addEventListener('click', function() {
                const name = this.querySelector('.icon-text, .service-text').textContent;
                alert(`您点击了：${name}\n功能开发中...`);
            });
        });
    });

    // 后台功能
    function renderUserList() {
        const userList = document.getElementById('userList');
        userList.innerHTML = '';
        for (let oldUser in userDatabase) {
            const userItem = document.createElement('div');
            userItem.style.margin = '15px 0';
            userItem.style.padding = '10px';
            userItem.style.border = '1px solid #eee';
            userItem.style.borderRadius = '8px';
            userItem.innerHTML = `
                <div style="margin:8px 0;">
                    <label>账号：</label>
                    <input type="text" value="${oldUser}" id="u_${oldUser}" style="padding:6px 8px; margin-left:10px; width:150px;">
                </div>
                <div style="margin:8px 0;">
                    <label>密码：</label>
                    <input type="text" value="${userDatabase[oldUser].password}" id="p_${oldUser}" style="padding:6px 8px; margin-left:10px; width:150px;">
                </div>
                <div style="margin:8px 0;">
                    <label>跳转图片URL：</label>
                    <input type="text" value="${userDatabase[oldUser].redirectUrl}" id="r_${oldUser}" style="padding:6px 8px; margin-left:10px; width:350px;">
                </div>
                <button onclick="saveUser('${oldUser}')" style="padding:6px 12px; background:#21b573; color:#fff; border:none; border-radius:4px; cursor:pointer; margin-right:10px;">保存修改</button>
                <button onclick="delUser('${oldUser}')" style="padding:6px 12px; background:#ff4d4f; color:#fff; border:none; border-radius:4px; cursor:pointer;">删除账号</button>
            `;
            userList.appendChild(userItem);
        }

        const addBtn = document.createElement('div');
        addBtn.style.marginTop = '20px';
        addBtn.innerHTML = `<button onclick="addUser()" style="padding:8px 16px; background:#000; color:#fff; border:none; border-radius:4px; cursor:pointer;">添加新用户</button>`;
        userList.appendChild(addBtn);
    }

    function saveUser(oldUser) {
        const newUsername = document.getElementById('u_' + oldUser).value.trim();
        const newPassword = document.getElementById('p_' + oldUser).value.trim();
        const newRedirectUrl = document.getElementById('r_' + oldUser).value.trim();
        if (!newUsername || !newPassword) { alert('账号密码不能为空！'); return; }
        delete userDatabase[oldUser];
        userDatabase[newUsername] = { password: newPassword, redirectUrl: newRedirectUrl };
        renderUserList();
        alert('修改成功！');
    }

    function delUser(user) {
        if (confirm('确定删除？')) {
            delete userDatabase[user];
            renderUserList();
            alert('删除成功！');
        }
    }

    function addUser() {
        const u = prompt('输入新账号：');
        if (!u) return;
        if (userDatabase[u]) { alert('已存在'); return; }
        userDatabase[u] = { password: '123456', redirectUrl: '' };
        renderUserList();
        alert('添加成功！默认密码123456');
    }

    function closeAdmin() {
        document.getElementById('adminPage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'flex';
    }
</script>
</body>
</html>
